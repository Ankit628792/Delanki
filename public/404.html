<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — Delanki Product Studio</title>
    <meta name="description" content="The requested page or case study could not be located in Delanki studio’s registry. Return to home or explore our product directory." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/da-black.svg" />
    <style>
      body {
        margin: 0;
        background-color: #090909;
        color: #f7f5f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .container {
        max-width: 520px;
        width: 100%;
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: #b7b7b7;
        margin-bottom: 24px;
      }
      .badge span { color: #f22952; }
      h1 {
        font-size: 80px;
        margin: 0 0 12px;
        line-height: 1;
        letter-spacing: -0.05em;
        color: #ffffff;
      }
      h2 {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 16px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #b7b7b7;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 9999px;
        background-color: #f22952;
        color: #ffffff;
        text-decoration: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: background-color 0.2s;
      }
      .btn:hover { background-color: #ff3b63; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge"><span>ERROR 404</span> // ROUTE NOT FOUND</div>
      <h1>404</h1>
      <h2>Lost in Cyberspace?</h2>
      <p>The page you are looking for has either been moved, decommissioned, or does not exist in our production registry.</p>
      <a href="/" class="btn">Return to Studio</a>
    </div>
  </body>
</html>
